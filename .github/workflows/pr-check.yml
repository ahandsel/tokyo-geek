# Build and content checks for every pull request, including forks.
# Does not write back to the branch. Lint autofix is a separate same-repo job.

name: PR check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, content, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # actions/checkout@v5.0.0, pinned
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # pnpm/action-setup@v4.2.0, pinned

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # actions/setup-node@v6.0.0, pinned
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (check only)
        run: pnpm lint-check

      - name: Check content pairing and frontmatter
        run: pnpm check-content

      - name: Check that docs/contents-structure.md is current
        run: |
          pnpm tree
          git diff --exit-code -- docs/contents-structure.md

      - name: Build VitePress site
        run: pnpm build

      - name: Check sitemap URLs
        run: pnpm check-sitemap
